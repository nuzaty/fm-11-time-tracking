<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./dist/styles.css?v=cc0138e">
  <script defer src="./js/main.js?v=cc0138e"></script>

  <title>Frontend Mentor | Time tracking dashboard</title>
  </style>
</head>

<body>
  <main class="dashboard">
    <div class="dashboard__container">
      <aside class="dashboard__context">
        <header class="dashboard__profile">
          <img src="./images/image-jeremy.png" alt="Jeremy Robson image">
          <section class="dashboard__profile-meta">
            <p>Report for</p>
            <h1>Jeremy Robson</h1>
          </section>
        </header>
        <nav class="dashboard__filter">
          <button data-period="daily">Daily</button>
          <button data-period="weekly">Weekly</button>
          <button data-period="monthly">Monthly</button>
        </nav>
      </aside>
      <section class="dashboard__main">
      </section>
    </div>
  </main>

  <template id="icon-ellipsis">
    <svg viewBox="0 0 21 5" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"
        fill="currentColor" fill-rule="evenodd" />
    </svg>
  </template>
</body>

</html>
